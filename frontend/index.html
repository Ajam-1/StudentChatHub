<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - ChatHub</title>

    <meta
        name="description"
        content="Create your free ChatHub account and connect with other students."
    >

    <link
        rel="stylesheet"
        href="signup.css"
    >

</head>


<body>

    <main class="auth-container">

        <div class="auth-card">

            <h1>ChatHub</h1>

            <p class="subtitle">
                Create your account
            </p>


            <form id="signup-form">


                <label for="username">
                    Username
                </label>


                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                    minlength="3"
                    maxlength="30"
                    required
                >


                <label for="email">
                    Email
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <button type="submit">
                    Create Account
                </button>


                <p id="message"></p>


            </form>


            <p class="switch">

                Already have an account?

                <a href="signin.html">
                    Sign in
                </a>

            </p>


        </div>

    </main>


    <script src="signup.js"></script>
    <script data-cfasync="false" src="https://afders.org/1/2b3396e7f6cc900ea3002dcc103367d7"></script>

</body>

</html>
