<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In - ChatHub</title>

    <meta
        name="description"
        content="Sign in to your ChatHub account."
    >

    <link
        rel="stylesheet"
        href="signin.css"
    >

</head>


<body>

    <main class="auth-container">

        <div class="auth-card">

            <h1>ChatHub</h1>

            <p class="subtitle">
                Welcome back
            </p>


            <form id="signin-form">


                <label for="email">
                    Email
                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Sign In
                </button>


                <p id="message"></p>


            </form>


            <p class="switch">

                Don't have an account?

                <a href="index.html">
                    Create one
                </a>

            </p>


        </div>

    </main>


    <script src="signin.js"></script>

</body>

</html>
